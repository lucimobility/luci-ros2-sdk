name: Create and Deploy Docker

on:
  workflow_dispatch:
    inputs:
      DEV:
        type: boolean
        description: "If the DEV image should be build"
        required: true
        default: false
      RELEASE:
        type: boolean
        description: "If the public RELEASE image should be build"
        required: true
        default: false


env:
  REPO: ${{github.event.repository.name}}

permissions:
  contents: read
  packages: write

jobs:
  Build-and-deploy-dev:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.DEV == 'true' }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout SDK Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: ${{env.REPO}}

      - name: Build and deploy dev
        run: |
          cd ${{env.REPO}}
          ./build-and-deploy-dockers.sh -d
        shell: bash

  Build-and-deploy-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.RELEASE == 'true' }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout SDK Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: ${{env.REPO}}
          
      - name: Build and deploy release
        run: |
          cd ${{env.REPO}}
          ./build-and-deploy-dockers.sh -r
        shell: bash
